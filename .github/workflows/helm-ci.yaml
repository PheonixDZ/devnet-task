---
name: CI-CD Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  packages: write
  actions: read
  security-events: write

jobs:
  lint:
    name: Lint YAML & Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Lint all YAML
        run: yamllint .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python code
        run: flake8 .
        continue-on-error: true


  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    needs: lint

    env:
      IMAGE_NAME: loadgen
      REGISTRY: ghcr.io
      OWNER: pheonixdz

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------
      # Setup Docker BuildX for multi-arch
      # ------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------
      # Login to GHCR
      # ------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------
      # Docker Cache
      # ------------------------------
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ------------------------------
      # Determine tag
      # ------------------------------
      - name: Determine version tag
        id: tagger
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      # ------------------------------
      # Multi-ARCH Build + Push
      # ------------------------------
      - name: Build & Push Multi-Arch
        uses: docker/build-push-action@v5
        with:
          context: charts/loadgen
          file: charts/loadgen/Dockerfile
          push: true
          tags: |
            ghcr.io/pheonixdz/loadgen:${{ steps.tagger.outputs.tag }}
            ghcr.io/pheonixdz/loadgen:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,new=true

      # ------------------------------
      # Output Image URLs
      # ------------------------------
      - name: Print image info
        run: |
          echo "Image pushed:"
          echo "ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.tagger.outputs.tag }}"
          echo "ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest"
